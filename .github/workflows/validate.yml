name: Validate dashboard data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check embedded data matches the CSV sources
        run: python3 scripts/build_dashboard_data.py --check

      - name: Check embedded tourism data matches the CSV sources
        run: python3 scripts/build_tourism_data.py --check

      - name: Check embedded demographics data matches the CSV sources
        run: python3 scripts/build_demographics_data.py --check

      - name: Check embedded economy data matches the CSV sources
        run: python3 scripts/build_economy_data.py --check

      - name: Check embedded census data matches the CSV sources
        run: python3 scripts/build_census_data.py --check

      - name: Check agriculture tables and the figures in the ELSTAT press releases
        run: |
          pip install openpyxl xlrd
          python3 scripts/verify_agriculture_data.py --reparse

      - name: Check embedded agriculture data matches the CSV sources
        run: python3 scripts/build_agriculture_data.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check dashboard JavaScript syntax
        run: |
          sed -n '/^<script>$/,/^<\/script>/p' archaeological-sites/index.html | sed '1d;$d' > dashboard.js
          node --check dashboard.js

      - name: Check tourism dashboard JavaScript syntax
        run: |
          sed -n '/^<script>$/,/^<\/script>/p' tourism-activity/index.html | sed '1d;$d' > tourism.js
          node --check tourism.js

      - name: Check demographics dashboard JavaScript syntax
        run: |
          sed -n '/^<script>$/,/^<\/script>/p' demographics/index.html | sed '1d;$d' > demographics.js
          node --check demographics.js

      - name: Check regional economy dashboard JavaScript syntax
        run: |
          sed -n '/^<script>$/,/^<\/script>/p' regional-economy/index.html | sed '1d;$d' > economy.js
          node --check economy.js

      - name: Check census dashboard JavaScript syntax
        run: |
          sed -n '/^<script>$/,/^<\/script>/p' demographics/census-2021/index.html | sed '1d;$d' > census.js
          node --check census.js

      - name: Check plant production dashboard JavaScript syntax
        run: |
          sed -n '/^<script>$/,/^<\/script>/p' agrifood/plant-production/index.html | sed '1d;$d' > plant.js
          node --check plant.js

      - name: Check shared agriculture dashboard script and the inline scripts of the pages that use it
        run: |
          node --check assets/js/agri-dashboard.js
          for page in holdings livestock economy employment prices; do
            sed -n '/^<script>$/,/^<\/script>/p' agrifood/$page/index.html | sed '1d;$d' > agri-$page.js
            node --check agri-$page.js
          done
